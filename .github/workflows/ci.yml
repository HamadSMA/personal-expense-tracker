# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: backend

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.103
    - name: Restore dependencies
      run: dotnet restore Finance.slnx
    - name: Build
      run: dotnet build Finance.slnx --no-restore --configuration Release
    - name: Unit tests
      run: dotnet test tests/Finance.UnitTests --no-build --configuration Release --verbosity normal
    - name: Integration tests
      run: dotnet test tests/Finance.IntegrationTests --no-build --configuration Release --verbosity normal
    - name: Docker build
      run: docker build -t ghcr.io/hamadsma/finance-api:latest -t ghcr.io/hamadsma/finance-api:${{ github.sha }} .
    - name: Log in to GitHub Container Registry
      if: github.event_name == 'push'
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: Push image
      if: github.event_name == 'push'
      run: docker push --all-tags ghcr.io/hamadsma/finance-api

  frontend:

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: frontend/finance-web

    env:
      VITE_API_BASE_URL: http://localhost:5048
      VITE_OIDC_AUTHORITY: http://localhost:8080/realms/finance
      VITE_OIDC_CLIENT_ID: finance-web

    steps:
    - uses: actions/checkout@v7
    - name: Setup Node
      uses: actions/setup-node@v6
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/finance-web/package-lock.json
    - name: Install dependencies
      run: npm ci
    - name: Tests
      run: npm test
    - name: Build
      run: npm run build
    - name: Docker build
      run: >-
        docker build
        --build-arg VITE_API_BASE_URL=$VITE_API_BASE_URL
        --build-arg VITE_OIDC_AUTHORITY=$VITE_OIDC_AUTHORITY
        --build-arg VITE_OIDC_CLIENT_ID=$VITE_OIDC_CLIENT_ID
        -t ghcr.io/hamadsma/finance-web:latest
        -t ghcr.io/hamadsma/finance-web:${{ github.sha }}
        .
    - name: Log in to GitHub Container Registry
      if: github.event_name == 'push'
      run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
    - name: Push image
      if: github.event_name == 'push'
      run: docker push --all-tags ghcr.io/hamadsma/finance-web